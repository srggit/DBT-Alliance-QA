<template>
    <div class="composite-cell slds-grid slds-grid_vertical-align-center slds-grid_noWrap">
        <div class="composite-cell__icon composite-cell__icon_neutral">
            <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
        </div>
        <div class="composite-cell__text">
            <div class="composite-cell__value slds-truncate" title={value}>{value}</div>
            <template lwc:if={line2}>
                <div class="composite-cell__sub slds-truncate">{line2}</div>
            </template>
        </div>
    </div>
</template>
