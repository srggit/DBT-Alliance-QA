<template>
    <lightning-card>
        <div class="cem-container">

            <div class="cem-banner">
                <div class="cem-banner-icon">
                    <lightning-icon icon-name="utility:table" size="small"></lightning-icon>
                </div>
                <div class="cem-banner-text">
                    <div class="cem-banner-title">{bannerTitle}</div>
                    <div class="cem-banner-subtitle">{bannerSubtitle}</div>
                </div>
            </div>

            <div class="cem-tabs" role="tablist">
                <button type="button" role="tab" aria-selected={isCommitteeTab} class={committeeTabClass}
                    data-tab="committee" onclick={handleTabClick}>Committee Review</button>
                <button type="button" role="tab" aria-selected={isReviewersTab} class={reviewersTabClass}
                    data-tab="reviewers" onclick={handleTabClick}>Reviewers Review</button>
            </div>

            <template lwc:if={isReviewersTab}>
                <div class="cem-reviewers-pane">
                    <c-peer-evaluation-matrix record-id={recordId} hide-decision-panel hide-banner></c-peer-evaluation-matrix>
                </div>
            </template>

            <template lwc:else>

            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-around_large">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={error}>
                <div class="slds-text-color_error slds-p-around_medium">{error}</div>
            </template>

            <template lwc:elseif={hasData}>
                <div class="cem-table-wrap">
                    <table class="cem-table">
                        <thead>
                            <tr>
                                <th class="cem-th cem-th_question">Question</th>
                                <template for:each={memberColumns} for:item="col">
                                    <th key={col.key} class="cem-th cem-th_member">
                                        <div class="cem-member-name">{col.label}</div>
                                        <div class="cem-member-meta">{col.status}</div>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={sections} for:item="section">
                                <tr key={section.key} class="cem-section-row">
                                    <td class="cem-section-cell cem-section-cell_question">{section.sectionName}</td>
                                    <td class="cem-section-cell" colspan={memberCount}></td>
                                </tr>
                                <template for:each={section.rows} for:item="row">
                                    <tr key={row.key} class="cem-tr">
                                        <td class="cem-td cem-td_question">
                                            <div class="cem-question-text">{row.question}</div>
                                        </td>
                                        <template for:each={row.cells} for:item="cell">
                                            <td key={cell.key} class="cem-td">
                                                <lightning-formatted-rich-text value={cell.value}>
                                                </lightning-formatted-rich-text>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template lwc:elseif={showNoData}>
                <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
                    No submitted Committee Evaluation responses available for this proposal.
                </div>
            </template>

            <template lwc:if={showDecisionPanel}>
                <div class="cem-decision-panel">
                    <div class="slds-form-element cem-feedback-field">
                        <label class="slds-form-element__label" for="committee-feedback-summary">Committee Feedback
                            Summary</label>
                        <div class="slds-form-element__control">
                            <textarea id="committee-feedback-summary" class="slds-textarea cem-feedback-textarea"
                                value={feedbackSummary} onchange={handleFeedbackChange}
                                placeholder="Enter committee feedback summary..."></textarea>
                        </div>
                    </div>
                    <template lwc:if={showRejectionReason}>
                        <div class="slds-form-element cem-feedback-field">
                            <label class="slds-form-element__label" for="committee-reason-for-rejection">Reason for
                                Rejection</label>
                            <div class="slds-form-element__control">
                                <textarea id="committee-reason-for-rejection"
                                    class="slds-textarea cem-feedback-textarea" value={rejectionReason}
                                    onchange={handleRejectionReasonChange}
                                    placeholder="Enter reason for rejection..."></textarea>
                            </div>
                        </div>
                        <div class="cem-decision-actions">
                            <button type="button" class="cem-decision-btn cem-decision-btn_neutral"
                                onclick={handleCancelRejection} disabled={isSavingDecision}>
                                <span>Cancel</span>
                            </button>
                            <button type="button" class="cem-decision-btn cem-decision-btn_reject"
                                onclick={handleConfirmRejection} disabled={isSavingDecision}>
                                <lightning-icon icon-name="utility:close" size="xx-small"
                                    class="cem-decision-btn-icon"></lightning-icon>
                                <span>Confirm Rejection</span>
                            </button>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="cem-decision-actions">
                            <button type="button" class="cem-decision-btn cem-decision-btn_reject"
                                onclick={handleRejectClick} disabled={isSavingDecision}>
                                <lightning-icon icon-name="utility:close" size="xx-small"
                                    class="cem-decision-btn-icon"></lightning-icon>
                                <span>Reject</span>
                            </button>
                            <button type="button" class="cem-decision-btn cem-decision-btn_proceed"
                                onclick={handleProceed} disabled={isSavingDecision}>
                                <lightning-icon icon-name="utility:check" size="xx-small"
                                    class="cem-decision-btn-icon"></lightning-icon>
                                <span>Proceed to Assign Chair/Co-Chair</span>
                            </button>
                        </div>
                    </template>
                </div>
            </template>
            </template>

        </div>
    </lightning-card>
</template>
