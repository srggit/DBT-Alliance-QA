<template>
    <div class="papf-container">

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading proposal..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={error}>
            <div class="slds-text-color_error slds-p-around_medium">{error}</div>
        </template>

        <template lwc:elseif={hasData}>
            <div class="papf-layout">

                <!-- ================================================= -->
                <!-- PATH -->
                <!-- ================================================= -->
                <div class="papf-path">
                    <template for:each={sidebarItems} for:item="item">
                        <div key={item.key} class={item.itemClass} data-key={item.key} onclick={handleSelectSection}>
                            <div class="papf-nav-icon-wrap">
                                <span class="papf-nav-number">{item.number}</span>
                            </div>
                            <span class="papf-nav-label">{item.label}</span>
                        </div>
                    </template>
                </div>

                <!-- ================================================= -->
                <!-- MAIN CONTENT -->
                <!-- ================================================= -->
                <div class="papf-main">

                    <template lwc:if={isProjectSummaryActive}>

                        <h2 class="papf-section-title">1. Project Summary</h2>

                        <div class="papf-field-block">
                            <div class="papf-field-header">a. Project Title&nbsp;
                                <span class="papf-field-limit">(Max 220 characters)</span>
                            </div>
                            <div class="papf-readonly-box">{projectTitle}</div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">b. Provide a summary of the proposed research
                                highlighting the following elements in the order given below&nbsp;
                                <span class="papf-field-limit">(250 words)</span>
                            </div>
                            <div class="papf-field-hint">Incorporate the following:</div>
                            <ol class="papf-field-hint-list">
                                <li>What is the central problem/gap addressed in the proposal? 2-3 sharp, testable
                                    aims;</li>
                                <li>Why is this problem important (scientific/ clinical/ public health relevance);
                                </li>
                                <li>Brief strategy, methods, unique expertise; New knowledge/capability and how this
                                    will seed your independent research programme;</li>
                            </ol>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={researchSummaryHighlightingElements}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">c. Summary of the proposed research for non-specialist
                                audience&nbsp;
                                <span class="papf-field-limit">(100 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={nonSpecialistSummary}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">d. Keywords&nbsp;
                                <span class="papf-field-limit">(Provide up to 6)</span>
                            </div>
                            <template lwc:if={hasKeywords}>
                                <div class="papf-chip-row">
                                    <template for:each={keywordChips} for:item="chip">
                                        <span key={chip.key} class="papf-chip">{chip.label}</span>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="papf-readonly-box"></div>
                            </template>
                        </div>

                    </template>

                    <template lwc:elseif={isResearchProposalActive}>

                        <h2 class="papf-section-title">2. Research Proposal</h2>

                        <div class="papf-field-block">
                            <div class="papf-field-header">a. Background and Significance&nbsp;
                                <span class="papf-field-limit">(350 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={backgroundAndSignificance}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">b. Aims &amp; Hypotheses&nbsp;
                                <span class="papf-field-limit">(250 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={aimsAndHypotheses}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">c. Work leading up to the Project&nbsp;
                                <span class="papf-field-limit">(350 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={workLeadingUpToProject}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">d. Experimental Design &amp; Methods&nbsp;
                                <span class="papf-field-limit">(750 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={experimentalDesignMethods}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">e. Full details of experiments (humans, animals, organoids
                                etc.)&nbsp;
                                <span class="papf-field-limit">(650 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={fullDetailsOfExperiments}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">f. Impact&nbsp;
                                <span class="papf-field-limit">(250 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={researchProposalImpact}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">g. Flowchart showing key stages of research plan and
                                timeline</div>
                            <div class="papf-field-hint">Not yet implemented - coming soon.</div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">h. Risks &amp; Mitigation&nbsp;
                                <span class="papf-field-limit">(250 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={risksMitigation}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">i. Project Milestones&nbsp;
                                <span class="papf-field-limit">(Upto 10 Entries)</span>
                            </div>
                            <template lwc:if={hasProjectMilestones}>
                                <div class="papf-mini-table-wrap">
                                    <table class="papf-mini-table">
                                        <thead>
                                            <tr>
                                                <th>Milestone</th>
                                                <th>Deliverables mapped to the objective</th>
                                                <th>Start Date</th>
                                                <th>End Date</th>
                                                <th>Location expected to deliver the milestone/outcome</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={projectMilestones} for:item="milestone">
                                                <tr key={milestone.key}>
                                                    <td>{milestone.milestone}</td>
                                                    <td class="papf-mini-table-td_wrap">
                                                        <lightning-formatted-rich-text value={milestone.deliverables}>
                                                        </lightning-formatted-rich-text>
                                                    </td>
                                                    <td>{milestone.startDate}</td>
                                                    <td>{milestone.endDate}</td>
                                                    <td>{milestone.location}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="papf-empty-note">No milestones added.</div>
                            </template>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">j. Gantt Chart</div>
                            <div class="papf-field-hint">Not yet implemented - coming soon.</div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">k. References&nbsp;
                                <span class="papf-field-limit">(1000 words)</span>
                            </div>
                            <div class="papf-readonly-box papf-readonly-box_tall">
                                <lightning-formatted-rich-text value={researchProposalReferences}>
                                </lightning-formatted-rich-text>
                            </div>
                        </div>

                    </template>

                    <template lwc:elseif={isHumanParticipantsActive}>

                        <h2 class="papf-section-title">3. Research Involving Human Participants</h2>

                        <div class="papf-field-block">
                            <div class="papf-field-header">Does your proposal include working with human
                                participants, experiments with human stem cells, biological samples, or personal
                                data?</div>
                            <div class="papf-yesno-toggle">
                                <div class={humanYesOptionClass}>
                                    <template lwc:if={includesHumanParticipants}>
                                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                    </template>
                                    <span>Yes</span>
                                </div>
                                <div class={humanNoOptionClass}>
                                    <span>No</span>
                                </div>
                            </div>
                        </div>

                        <template lwc:if={includesHumanParticipants}>

                            <div class="papf-field-block">
                                <div class="papf-field-header">My project involves:</div>
                                <div class="papf-checkbox-grid">
                                    <div class="papf-checkbox-row">
                                        <span class={involvesHumanParticipantsBoxClass}>
                                            <template lwc:if={isInvolvesHumanParticipantsChecked}>
                                                <lightning-icon icon-name="utility:check" size="xx-small">
                                                </lightning-icon>
                                            </template>
                                        </span>
                                        <span class="papf-checkbox-label">Human participants</span>
                                    </div>
                                    <div class="papf-checkbox-row">
                                        <span class={involvesStemCellsBoxClass}>
                                            <template lwc:if={isInvolvesStemCellsChecked}>
                                                <lightning-icon icon-name="utility:check" size="xx-small">
                                                </lightning-icon>
                                            </template>
                                        </span>
                                        <span class="papf-checkbox-label">Experiments with human stem cells</span>
                                    </div>
                                    <div class="papf-checkbox-row">
                                        <span class={involvesPersonalDataBoxClass}>
                                            <template lwc:if={isInvolvesPersonalDataChecked}>
                                                <lightning-icon icon-name="utility:check" size="xx-small">
                                                </lightning-icon>
                                            </template>
                                        </span>
                                        <span class="papf-checkbox-label">Personal data</span>
                                    </div>
                                    <div class="papf-checkbox-row">
                                        <span class={involvesBiologicalSamplesBoxClass}>
                                            <template lwc:if={isInvolvesBiologicalSamplesChecked}>
                                                <lightning-icon icon-name="utility:check" size="xx-small">
                                                </lightning-icon>
                                            </template>
                                        </span>
                                        <span class="papf-checkbox-label">Biological samples</span>
                                    </div>
                                </div>
                            </div>

                            <template lwc:if={isInvolvesHumanParticipantsChecked}>
                                <div class="papf-participant-card">
                                    <div class="papf-participant-title papf-participant-title_accent">Human
                                        participants</div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Sample size calculation, including
                                            statistical analysis</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={sampleSizeCalculation}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Study population characteristics</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={studyPopulationCharacteristics}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Eligibility criteria
                                            <span class="papf-field-limit">(100 words)</span>
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={humanEligibilityCriteria}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Age (maximum-minimum)</div>
                                        <div class="papf-readonly-box">{humanAgeMaximumMinimum}</div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Recruitment and retention plan</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={recruitmentAndRetentionPlan}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Timeline</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={humanTimeline}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">List the regulatory bodies responsible for
                                            ethical review of the project and indicate the expected timeline. Any
                                            additional regulatory approval obtained or anticipated may be listed
                                            <span class="papf-field-limit">(200 words)</span>
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={humanRegulatoryBodies}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={isInvolvesStemCellsChecked}>
                                <div class="papf-participant-card">
                                    <div class="papf-participant-title papf-participant-title_accent">
                                        Experiments with human stem cells</div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Details of stem cell &amp; experiment
                                            nature</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={stemCellExperimentNature}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Regulatory bodies (human stem cells)</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={stemCellRegulatoryBodies}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Human biohazards &amp; safety precaution
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={stemCellBiohazardsSafety}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">What is the protocol for waste management?
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={stemCellWasteProtocol}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={isInvolvesPersonalDataChecked}>
                                <div class="papf-participant-card">
                                    <div class="papf-participant-title papf-participant-title_accent">Personal
                                        Data</div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Details of source of personal data</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={personalDataSource}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Measures taken to protect privacy/rights
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={personalDataPrivacyMeasures}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Regulatory bodies (personal data), ethical
                                            review</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={personalDataRegulatoryBodies}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={isInvolvesBiologicalSamplesChecked}>
                                <div class="papf-participant-card">
                                    <div class="papf-participant-title papf-participant-title_accent">Biological
                                        Samples</div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Biological samples, nature of experiment
                                        </div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={bioSamplesNature}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Biohazards associated (biological)</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={bioSamplesBiohazards}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Regulatory bodies responsible</div>
                                        <div class="papf-readonly-box papf-readonly-box_tall">
                                            <lightning-formatted-rich-text value={bioSamplesRegulatoryBodies}>
                                            </lightning-formatted-rich-text>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="papf-participant-card">
                                <div class="papf-field-header">2. Tick the appropriate: In the course of the
                                    project will any hospital/clinical facility be used?</div>
                                <div class="papf-checkbox-grid">
                                    <div class={hospitalFacilityUseOptionClass}>
                                        <span class="papf-radio-dot"></span>
                                        <span class="papf-radio-label">I propose to use facilities within a
                                            hospital/clinic.</span>
                                    </div>
                                    <div class={hospitalFacilityPatientsOptionClass}>
                                        <span class="papf-radio-dot"></span>
                                        <span class="papf-radio-label">My research involves patients being cared
                                            for by a hospital/clinical facility.</span>
                                    </div>
                                    <div class={hospitalFacilityNotRequiredOptionClass}>
                                        <span class="papf-radio-dot"></span>
                                        <span class="papf-radio-label">My research does not require
                                            hospital/clinic facility.</span>
                                    </div>
                                </div>

                                <template lwc:if={showHospitalAddress}>
                                    <div class="papf-field-block papf-card-field-spaced">
                                        <div class="papf-field-header">Name &amp; Address of Hospital/clinical
                                        </div>
                                        <div class="papf-readonly-box">{hospitalAddress}</div>
                                    </div>

                                    <div class="papf-field-block">
                                        <div class="papf-field-header">Letter of Participation from Clinical
                                            Collaborator - Upload Status</div>
                                        <span class={hospitalLetterStatusClass}>
                                            <lightning-icon icon-name={hospitalLetterStatusIcon} size="xx-small">
                                            </lightning-icon>
                                            <span>{hospitalLetterUploadStatus}</span>
                                        </span>
                                    </div>
                                </template>
                            </div>

                            <div class="papf-participant-card">
                                <div class="papf-field-header">3. Does your proposal require informed consent
                                    from study population?</div>
                                <div class="papf-radio-group papf-radio-group_horizontal">
                                    <div class={requireConsentYesOptionClass}>
                                        <span class="papf-radio-dot"></span>
                                        <span class="papf-radio-label">Yes</span>
                                    </div>
                                    <div class={requireConsentNoOptionClass}>
                                        <span class="papf-radio-dot"></span>
                                        <span class="papf-radio-label">No</span>
                                    </div>
                                </div>
                            </div>

                        </template>

                    </template>

                    <template lwc:elseif={isAnimalExperimentsActive}>

                        <h2 class="papf-section-title">4. Research Involving Experiment on Animals</h2>

                        <div class="papf-field-block">
                            <div class="papf-field-header">1. Does your proposal involve the use of animals, animal
                                tissue, and/or non-human stem cells?</div>
                            <div class="papf-radio-group papf-radio-group_horizontal">
                                <div class={involvesYesClass}>
                                    <span class="papf-radio-dot"></span>
                                    <span class="papf-radio-label">Yes</span>
                                </div>
                                <div class={involvesNoClass}>
                                    <span class="papf-radio-dot"></span>
                                    <span class="papf-radio-label">No</span>
                                </div>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">Tick where appropriate. My proposal involves:</div>
                            <div class="papf-checkbox-grid">
                                <div class="papf-checkbox-row">
                                    <span class={involvesAnimalsBoxClass}>
                                        <template lwc:if={isAnimalsChecked}>
                                            <lightning-icon icon-name="utility:check" size="xx-small">
                                            </lightning-icon>
                                        </template>
                                    </span>
                                    <span class="papf-checkbox-label">The use of animals</span>
                                </div>
                                <div class="papf-checkbox-row">
                                    <span class={involvesAnimalTissueBoxClass}>
                                        <template lwc:if={isAnimalTissueChecked}>
                                            <lightning-icon icon-name="utility:check" size="xx-small">
                                            </lightning-icon>
                                        </template>
                                    </span>
                                    <span class="papf-checkbox-label">The use of animal tissue</span>
                                </div>
                                <div class="papf-checkbox-row">
                                    <span class={nonHumanStemCellsBoxClass}>
                                        <template lwc:if={isStemCellsChecked}>
                                            <lightning-icon icon-name="utility:check" size="xx-small">
                                            </lightning-icon>
                                        </template>
                                    </span>
                                    <span class="papf-checkbox-label">The use of non-human stem cells</span>
                                </div>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">2. Does your proposal include procedures to be carried out
                                on animals which require formal approval?</div>
                            <div class="papf-radio-group papf-radio-group_horizontal">
                                <div class={proceduresApprovalYesClass}>
                                    <span class="papf-radio-dot"></span>
                                    <span class="papf-radio-label">Yes</span>
                                </div>
                                <div class={proceduresApprovalNoClass}>
                                    <span class="papf-radio-dot"></span>
                                    <span class="papf-radio-label">No</span>
                                </div>
                            </div>
                        </div>

                        <div class="papf-field-block">
                            <div class="papf-field-header">3. Provide the CCSEA registration number for the
                                institution where the animal work will be conducted&nbsp;
                                <span class="papf-field-limit">(200 words)</span>
                            </div>
                            <div class="papf-readonly-box"><lightning-formatted-rich-text
                                    value={ccseaRegistrationNumber}></lightning-formatted-rich-text></div>
                        </div>

                        <div class="papf-field-block">
